<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LifeTrack — Goals &amp; Finance Ledger</title>
<style>
  :root{
    --paper:#F1ECE0;
    --paper-alt:#E7DFC9;
    --ink:#26312B;
    --ink-soft:#6B7268;
    --line:#D6CDB6;
    --moss:#3F6E52;
    --moss-soft:#E4EBE3;
    --rust:#A8543A;
    --rust-soft:#F1E2DB;
    --indigo:#4A5FA0;
    --indigo-soft:#E5E8F1;
    --gold:#9B7B2E;
    --gold-soft:#F1E9D3;
    --radius:3px;
    --font-serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--paper);
  }
  .num{
    font-family:var(--font-serif);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.01em;
  }

  /* Header */
  header.top{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  header.top .wordmark{
    font-family:var(--font-serif);
    font-size:20px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  header.top .date{
    color:var(--ink-soft);
    font-size:13px;
    margin-top:2px;
  }

  .balance-strip{
    display:flex;
    border-bottom:1px solid var(--line);
  }
  .balance-strip .cell{
    flex:1;
    padding:14px 12px;
    text-align:left;
  }
  .balance-strip .cell + .cell{ border-left:1px solid var(--line); }
  .balance-strip .label{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .balance-strip .value{
    font-size:17px;
    font-weight:600;
  }
  .balance-strip .income .value{ color:var(--moss); }
  .balance-strip .expense .value{ color:var(--rust); }

  /* Content */
  main{
    flex:1;
    overflow-y:auto;
    padding:16px 20px 96px;
  }
  .section-title{
    font-size:14px;
    font-weight:600;
    margin:20px 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .section-title:first-child{ margin-top:4px; }
  .section-title .link{
    font-size:12px;
    color:var(--ink-soft);
    font-weight:400;
    cursor:pointer;
  }

  .empty-state{
    color:var(--ink-soft);
    font-size:13.5px;
    padding:18px 0;
    line-height:1.5;
  }

  /* Ledger rows */
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .row .swatch{
    width:4px;
    align-self:stretch;
    border-radius:2px;
    flex-shrink:0;
  }
  .row .body{ flex:1; min-width:0; }
  .row .title{ font-size:14.5px; font-weight:500; }
  .row .sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .row .amount{ font-size:15px; font-weight:600; white-space:nowrap; }
  .row .amount.income{ color:var(--moss); }
  .row .amount.expense{ color:var(--rust); }
  .row .del{
    color:var(--ink-soft);
    font-size:17px;
    padding:4px 2px;
    cursor:pointer;
    flex-shrink:0;
  }

  /* Goal card */
  .goal-card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    margin-bottom:10px;
    background:var(--paper);
  }
  .goal-card .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .goal-card .title{ font-size:15px; font-weight:600; }
  .goal-card .cat-tag{
    font-size:10.5px;
    color:var(--indigo);
    background:var(--indigo-soft);
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
  }
  .goal-card .desc{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .progress-track{
    height:6px;
    background:var(--paper-alt);
    border-radius:4px;
    margin-top:10px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--indigo);
    border-radius:4px;
    transition:width 0.35s ease;
  }
  .goal-card .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stepper{ display:flex; align-items:center; gap:0; }
  .stepper button{
    width:26px; height:26px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:4px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    line-height:1;
  }
  .stepper button:first-child{ margin-right:6px; }
  .checkin-btn{
    border:1px solid var(--moss);
    color:var(--moss);
    background:var(--moss-soft);
    font-size:12px;
    padding:5px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .checkin-btn:disabled{
    opacity:0.55;
    cursor:default;
  }
  .milestone{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 0;
    font-size:13.5px;
    border-bottom:1px solid var(--line);
  }
  .milestone:last-child{ border-bottom:none; }
  .milestone.done{ color:var(--ink-soft); text-decoration:line-through; }
  .milestone input{ accent-color:var(--moss); width:16px; height:16px; }

  /* Budget row */
  .budget-row{ margin-bottom:14px; }
  .budget-row .top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13.5px; margin-bottom:6px;
  }
  .budget-row .group-name{ font-weight:600; }
  .budget-row .figures{ color:var(--ink-soft); font-size:12.5px; }
  .budget-row .figures.over{ color:var(--rust); }
  .budget-track{ height:7px; background:var(--paper-alt); border-radius:4px; overflow:hidden; }
  .budget-fill{ height:100%; border-radius:4px; background:var(--gold); }
  .budget-fill.over{ background:var(--rust); }
  .budget-edit{
    font-size:11.5px; color:var(--ink-soft);
    margin-top:5px; cursor:pointer;
    text-decoration:underline;
    text-decoration-color:var(--line);
  }

  /* Bottom nav */
  nav.tabbar{
    position:fixed;
    bottom:0; left:50%;
    transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  nav.tabbar button{
    flex:1;
    background:none; border:none;
    padding:10px 4px 8px;
    display:flex; flex-direction:column;
    align-items:center; gap:3px;
    color:var(--ink-soft);
    font-family:var(--font-sans);
    font-size:10.5px;
    cursor:pointer;
  }
  nav.tabbar button.active{ color:var(--ink); }
  nav.tabbar button .icon{ font-size:18px; line-height:1; }
  nav.tabbar button.active .icon{ color:var(--indigo); }

  /* FAB */
  .fab{
    position:fixed;
    bottom:76px; left:50%;
    transform:translateX(calc(-50% + 190px));
    width:52px; height:52px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:26px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(38,49,43,0.28);
  }
  @media (max-width:480px){
    .fab{ transform:none; right:20px; left:auto; }
  }

  /* Bottom sheet */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(38,49,43,0.35);
    opacity:0; pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:20;
  }
  .sheet-overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed;
    left:50%; bottom:0;
    transform:translate(-50%, 100%);
    width:100%; max-width:480px;
    max-height:88vh;
    background:var(--paper);
    border-top-left-radius:14px;
    border-top-right-radius:14px;
    box-shadow:0 -6px 24px rgba(38,49,43,0.2);
    transition:transform 0.3s cubic-bezier(.22,.9,.36,1);
    z-index:21;
    overflow-y:auto;
    padding:10px 20px 28px;
  }
  .sheet.open{ transform:translate(-50%, 0); }
  .sheet-handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:4px;
    margin:6px auto 14px;
  }
  .sheet h2{
    font-family:var(--font-serif);
    font-size:19px;
    margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12px; color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--font-sans);
    font-size:15px;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:64px; }
  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .seg button{
    flex:1;
    padding:9px 0;
    background:var(--paper);
    border:none;
    font-family:var(--font-sans);
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.active{ background:var(--ink); color:var(--paper); }
  .save-btn{
    width:100%;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:6px;
  }
  .save-btn:disabled{ opacity:0.4; cursor:default; }
  .two-col{ display:flex; gap:10px; }
  .two-col .field{ flex:1; }

  .settings-block{ margin-bottom:22px; }
  .settings-block h3{
    font-size:13px; text-transform:none; color:var(--ink-soft);
    margin:0 0 8px; font-weight:600;
  }
  .settings-block p{
    font-size:13.5px; margin:0 0 6px; line-height:1.5;
  }
  .danger-btn{
    border:1px solid var(--rust);
    color:var(--rust);
    background:var(--rust-soft);
    padding:9px 14px;
    border-radius:var(--radius);
    font-size:13px;
    cursor:pointer;
  }

  .toast{
    position:fixed;
    bottom:90px; left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    padding:9px 16px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:30;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wordmark">LifeTrack</div>
    <div class="date" id="today-label"></div>
  </header>

  <div class="balance-strip" id="balance-strip"></div>

  <main id="content"></main>

  <button class="fab" id="fab">+</button>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home"><span class="icon">&#8962;</span>Home</button>
    <button data-tab="money"><span class="icon">&#8361;</span>Money</button>
    <button data-tab="goals"><span class="icon">&#9733;</span>Goals</button>
    <button data-tab="budgets"><span class="icon">&#9636;</span>Budgets</button>
    <button data-tab="settings"><span class="icon">&#9881;</span>More</button>
  </nav>
</div>

<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Category taxonomy (from user's reference budget spreadsheet) ---------- */
const CATEGORIES = {
  "Children": ["Activities","Allowance","Medical","Childcare","Clothing","School","Toys","Other"],
  "Debt": ["Credit cards","Student loans","Other loans","Taxes (federal)","Taxes (state)","Other"],
  "Education": ["Tuition","Books","Music lessons","Other"],
  "Entertainment": ["Books","Concerts/shows","Games","Hobbies","Movies","Music","Outdoor activities","Photography","Sports","Theater/plays","TV","Other"],
  "Everyday": ["Groceries","Restaurants","Personal supplies","Clothes","Laundry/dry cleaning","Hair/beauty","Subscriptions","Other"],
  "Gifts": ["Gifts","Donations (charity)","Other"],
  "Health/medical": ["Doctors/dental/vision","Specialty care","Pharmacy","Emergency","Other"],
  "Home": ["Rent/mortgage","Property taxes","Furnishings","Lawn/garden","Supplies","Maintenance","Improvements","Moving","Other"],
  "Insurance": ["Car","Health","Home","Life","Other"],
  "Pets": ["Food","Vet/medical","Toys","Supplies","Other"],
  "Technology": ["Domains & hosting","Online services","Hardware","Software","Other"],
  "Transportation": ["Fuel","Car payments","Repairs","Registration/license","Supplies","Public transit","Other"],
  "Travel": ["Airfare","Hotels","Food","Transportation","Entertainment","Other"],
  "Utilities": ["Phone","TV","Internet","Electricity","Heat/gas","Water","Trash","Other"],
  "Other": ["Miscellaneous"]
};
const GROUP_NAMES = Object.keys(CATEGORIES);

/* ---------- State ---------- */
let STATE = {
  transactions: [],   // {id, type, amount, group, subcategory, payment, note, date}
  goals: [],          // {id, title, desc, category, type, targetNumber, targetUnit, currentNumber, state, streak, bestStreak, lastCheckin, milestones:[{text,done}]}
  budgets: {}          // { "YYYY-MM": { groupName: limitAmount } }
};
const STORAGE_KEY = 'lifetrack-app-data';
let currentTab = 'home';
let saveTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ const dt = new Date(d); return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0'); }
function fmt(n){
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return '\u20b9' + v.toLocaleString('en-IN', {maximumFractionDigits:0});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ---------- Persistence (window.storage — personal, per-user) ---------- */
async function loadState(){
  try{
    const result = await window.storage.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      STATE = Object.assign(STATE, parsed);
    }
  }catch(e){
    // key not found yet on first run — that's fine, keep defaults
    console.log('No saved data yet, starting fresh.');
  }
}
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
    }catch(e){
      console.error('Save failed', e);
      showToast('Could not save — check connection');
    }
  }, 250);
}

/* ---------- Derived data ---------- */
function txnsForMonth(ym){
  return STATE.transactions.filter(t => monthKey(t.date) === ym);
}
function monthTotals(ym){
  const list = txnsForMonth(ym);
  const income = list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  return {income, expense};
}
function spendByGroup(ym){
  const map = {};
  txnsForMonth(ym).filter(t=>t.type==='expense').forEach(t=>{
    map[t.group] = (map[t.group]||0) + t.amount;
  });
  return map;
}

/* ---------- Rendering ---------- */
function render(){
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'});
  renderBalanceStrip();
  renderTabbar();
  const fab = document.getElementById('fab');
  fab.style.display = (currentTab==='money' || currentTab==='goals') ? 'flex' : 'none';

  const main = document.getElementById('content');
  if(currentTab==='home') main.innerHTML = renderHome();
  else if(currentTab==='money') main.innerHTML = renderMoney();
  else if(currentTab==='goals') main.innerHTML = renderGoals();
  else if(currentTab==='budgets') main.innerHTML = renderBudgets();
  else if(currentTab==='settings') main.innerHTML = renderSettings();

  attachContentHandlers();
}

function renderBalanceStrip(){
  const ym = monthKey(new Date());
  const {income, expense} = monthTotals(ym);
  document.getElementById('balance-strip').innerHTML = `
    <div class="cell income"><div class="label">Income</div><div class="value num">${fmt(income)}</div></div>
    <div class="cell expense"><div class="label">Expense</div><div class="value num">${fmt(expense)}</div></div>
    <div class="cell"><div class="label">Balance</div><div class="value num">${fmt(income-expense)}</div></div>
  `;
}

function renderTabbar(){
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === currentTab);
  });
}

function groupColor(name){
  // small deterministic palette rotation across the three accent hues
  const hues = ['var(--moss)','var(--rust)','var(--indigo)','var(--gold)'];
  let h=0; for(const c of name) h += c.charCodeAt(0);
  return hues[h % hues.length];
}

function renderHome(){
  const activeGoals = STATE.goals.filter(g=>g.state==='active').slice(0,3);
  const recent = [...STATE.transactions].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0,5);

  let html = '';
  html += `<div class="section-title">Active goals <span class="link" data-nav="goals">See all</span></div>`;
  html += activeGoals.length ? activeGoals.map(goalCardHtml).join('') :
    `<div class="empty-state">No active goals yet. Tap Goals below to set one.</div>`;

  html += `<div class="section-title">Recent transactions <span class="link" data-nav="money">See all</span></div>`;
  html += recent.length ? `<div>${recent.map(transactionRowHtml).join('')}</div>` :
    `<div class="empty-state">No transactions logged yet. Tap + on the Money tab to add one.</div>`;

  return html;
}

function transactionRowHtml(t){
  const label = t.type==='expense' ? (t.subcategory + ' · ' + t.group) : 'Income';
  return `
  <div class="row" data-txn="${t.id}">
    <div class="swatch" style="background:${t.type==='income' ? 'var(--moss)' : groupColor(t.group||'Other')}"></div>
    <div class="body">
      <div class="title">${label}</div>
      <div class="sub">${t.note ? escapeHtml(t.note) + ' · ' : ''}${formatDateShort(t.date)} · ${t.payment}</div>
    </div>
    <div class="amount num ${t.type}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div>
    <div class="del" data-del-txn="${t.id}">&times;</div>
  </div>`;
}

function formatDateShort(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}

function renderMoney(){
  const sorted = [...STATE.transactions].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  if(!sorted.length) return `<div class="section-title">All transactions</div><div class="empty-state">Nothing logged yet. Tap the + button to add your first income or expense.</div>`;
  return `<div class="section-title">All transactions</div><div>${sorted.map(transactionRowHtml).join('')}</div>`;
}

function goalCardHtml(g){
  let progressHtml = '';
  let metaHtml = '';
  if(g.type==='numeric'){
    const pct = g.targetNumber>0 ? Math.min(100, (g.currentNumber/g.targetNumber)*100) : 0;
    progressHtml = `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    metaHtml = `
      <div class="meta-row">
        <span>${g.currentNumber} / ${g.targetNumber} ${escapeHtml(g.targetUnit||'')}</span>
        <div class="stepper">
          <button data-goal-dec="${g.id}">&minus;</button>
          <button data-goal-inc="${g.id}">+</button>
        </div>
      </div>`;
  } else if(g.type==='habit'){
    const doneToday = g.lastCheckin === todayStr();
    progressHtml = `<div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, g.streak*10)}%"></div></div>`;
    metaHtml = `
      <div class="meta-row">
        <span>Streak: ${g.streak} days · best ${g.bestStreak}</span>
        <button class="checkin-btn" data-checkin="${g.id}" ${doneToday?'disabled':''}>${doneToday?'Done today':'Check in'}</button>
      </div>`;
  } else { // checklist
    const total = g.milestones.length;
    const done = g.milestones.filter(m=>m.done).length;
    const pct = total ? (done/total)*100 : 0;
    progressHtml = `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    metaHtml = `<div style="margin-top:8px;">` + g.milestones.map((m,i)=>`
      <label class="milestone ${m.done?'done':''}">
        <input type="checkbox" data-milestone="${g.id}:${i}" ${m.done?'checked':''}>
        ${escapeHtml(m.text)}
      </label>`).join('') + `</div>`;
  }
  return `
  <div class="goal-card">
    <div class="top-row">
      <div class="title">${escapeHtml(g.title)}</div>
      <div class="cat-tag">${g.category}</div>
    </div>
    ${g.desc ? `<div class="desc">${escapeHtml(g.desc)}</div>` : ''}
    ${progressHtml}
    ${metaHtml}
  </div>`;
}

function renderGoals(){
  const active = STATE.goals.filter(g=>g.state==='active');
  const completed = STATE.goals.filter(g=>g.state==='completed');
  let html = `<div class="section-title">Active goals</div>`;
  html += active.length ? active.map(goalCardHtml).join('') : `<div class="empty-state">No goals yet. Tap + to set your first one.</div>`;
  if(completed.length){
    html += `<div class="section-title">Completed</div>`;
    html += completed.map(goalCardHtml).join('');
  }
  return html;
}

function renderBudgets(){
  const ym = monthKey(new Date());
  const limits = STATE.budgets[ym] || {};
  const spend = spendByGroup(ym);
  let html = `<div class="section-title">Budgets this month</div>`;
  html += GROUP_NAMES.map(g=>{
    const limit = limits[g] || 0;
    const actual = spend[g] || 0;
    const pct = limit>0 ? Math.min(100, (actual/limit)*100) : 0;
    const over = limit>0 && actual>limit;
    return `
    <div class="budget-row">
      <div class="top">
        <span class="group-name">${g}</span>
        <span class="figures ${over?'over':''}">${fmt(actual)}${limit>0 ? ' / '+fmt(limit) : ''}</span>
      </div>
      ${limit>0 ? `<div class="budget-track"><div class="budget-fill ${over?'over':''}" style="width:${pct}%"></div></div>` : ''}
      <div class="budget-edit" data-set-budget="${g}">${limit>0 ? 'Edit limit' : 'Set a monthly limit'}</div>
    </div>`;
  }).join('');
  return html;
}

function renderSettings(){
  return `
    <div class="settings-block">
      <h3>About this app</h3>
      <p>Currency: Indian Rupee (₹). Data lives only in this browser — nothing is sent anywhere.</p>
      <p>Add this page to your phone's home screen for a native-app feel: use your browser's share/menu button and choose "Add to Home Screen".</p>
    </div>
    <div class="settings-block">
      <h3>Data</h3>
      <p>${STATE.transactions.length} transactions · ${STATE.goals.length} goals saved.</p>
      <button class="danger-btn" id="clear-data">Delete all my data</button>
    </div>
  `;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Event handling within content ---------- */
function attachContentHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ currentTab = el.dataset.nav; render(); };
  });
  document.querySelectorAll('[data-del-txn]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.delTxn;
      STATE.transactions = STATE.transactions.filter(t=>t.id!==id);
      queueSave(); render(); showToast('Transaction deleted');
    };
  });
  document.querySelectorAll('[data-goal-inc]').forEach(el=>{
    el.onclick = ()=> bumpGoal(el.dataset.goalInc, 1);
  });
  document.querySelectorAll('[data-goal-dec]').forEach(el=>{
    el.onclick = ()=> bumpGoal(el.dataset.goalDec, -1);
  });
  document.querySelectorAll('[data-checkin]').forEach(el=>{
    el.onclick = ()=> checkinGoal(el.dataset.checkin);
  });
  document.querySelectorAll('[data-milestone]').forEach(el=>{
    el.onchange = ()=>{
      const [goalId, idx] = el.dataset.milestone.split(':');
      const g = STATE.goals.find(x=>x.id===goalId);
      g.milestones[+idx].done = el.checked;
      if(g.milestones.every(m=>m.done)) g.state='completed';
      queueSave(); render();
    };
  });
  document.querySelectorAll('[data-set-budget]').forEach(el=>{
    el.onclick = ()=> openBudgetSheet(el.dataset.setBudget);
  });
  const clearBtn = document.getElementById('clear-data');
  if(clearBtn) clearBtn.onclick = ()=>{
    if(confirm('This will permanently delete all transactions and goals stored in this browser. Continue?')){
      STATE = {transactions:[], goals:[], budgets:{}};
      queueSave(); render(); showToast('All data deleted');
    }
  };
}

function bumpGoal(id, delta){
  const g = STATE.goals.find(x=>x.id===id);
  if(!g) return;
  g.currentNumber = Math.max(0, g.currentNumber + delta);
  if(g.targetNumber>0 && g.currentNumber >= g.targetNumber) g.state='completed';
  queueSave(); render();
}

function checkinGoal(id){
  const g = STATE.goals.find(x=>x.id===id);
  if(!g) return;
  const today = todayStr();
  if(g.lastCheckin === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  g.streak = (g.lastCheckin === yesterday) ? g.streak+1 : 1;
  g.bestStreak = Math.max(g.bestStreak||0, g.streak);
  g.lastCheckin = today;
  queueSave(); render(); showToast('Nice — streak updated');
}

/* ---------- Bottom sheets ---------- */
function openSheet(html){
  document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('overlay').onclick = closeSheet;

function openAddTransactionSheet(){
  let type = 'expense';
  let group = GROUP_NAMES[0];

  function bodyHtml(){
    const subs = CATEGORIES[group];
    return `
    <h2>Add transaction</h2>
    <div class="field">
      <div class="seg" id="type-seg">
        <button data-t="expense" class="${type==='expense'?'active':''}">Expense</button>
        <button data-t="income" class="${type==='income'?'active':''}">Income</button>
      </div>
    </div>
    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" inputmode="decimal" id="f-amount" placeholder="0">
    </div>
    <div id="expense-fields" style="${type==='income'?'display:none':''}">
      <div class="two-col">
        <div class="field">
          <label>Group</label>
          <select id="f-group">${GROUP_NAMES.map(g=>`<option ${g===group?'selected':''}>${g}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Subcategory</label>
          <select id="f-sub">${subs.map(s=>`<option>${s}</option>`).join('')}</select>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Payment method</label>
      <select id="f-payment">
        <option>UPI</option><option>Cash</option><option>Card</option><option>Bank</option><option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="f-note" placeholder="e.g. dinner with friends">
    </div>
    <button class="save-btn" id="save-txn">Save transaction</button>
    `;
  }

  openSheet(bodyHtml());
  wireAddTxnHandlers();

  function wireAddTxnHandlers(){
    document.querySelectorAll('#type-seg button').forEach(b=>{
      b.onclick = ()=>{
        type = b.dataset.t;
        document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + bodyHtml();
        wireAddTxnHandlers();
      };
    });
    const groupSel = document.getElementById('f-group');
    if(groupSel){
      groupSel.onchange = ()=>{
        group = groupSel.value;
        document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + bodyHtml();
        wireAddTxnHandlers();
      };
    }
    document.getElementById('save-txn').onclick = ()=>{
      const amount = parseFloat(document.getElementById('f-amount').value);
      if(!amount || amount<=0){ showToast('Enter a valid amount'); return; }
      const payment = document.getElementById('f-payment').value;
      const note = document.getElementById('f-note').value.trim();
      const txn = {
        id: uid(), type, amount,
        group: type==='expense' ? document.getElementById('f-group').value : null,
        subcategory: type==='expense' ? document.getElementById('f-sub').value : null,
        payment, note, date: todayStr()
      };
      STATE.transactions.push(txn);
      queueSave(); closeSheet(); render(); showToast('Transaction saved');
    };
  }
}

function openAddGoalSheet(){
  let type = 'numeric';
  function bodyHtml(){
    return `
    <h2>New goal</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="g-title" placeholder="e.g. Read more books">
    </div>
    <div class="field">
      <label>Description (optional)</label>
      <input type="text" id="g-desc">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="g-category">
        <option>Health</option><option>Career</option><option>Finance</option>
        <option>Learning</option><option>Personal</option><option>Custom</option>
      </select>
    </div>
    <div class="field">
      <label>Type</label>
      <div class="seg" id="type-seg">
        <button data-t="numeric" class="${type==='numeric'?'active':''}">Numeric</button>
        <button data-t="habit" class="${type==='habit'?'active':''}">Habit</button>
        <button data-t="checklist" class="${type==='checklist'?'active':''}">Checklist</button>
      </div>
    </div>
    ${type==='numeric' ? `
    <div class="two-col">
      <div class="field"><label>Target number</label><input type="number" id="g-target" placeholder="e.g. 24"></div>
      <div class="field"><label>Unit</label><input type="text" id="g-unit" placeholder="books"></div>
    </div>` : ''}
    ${type==='checklist' ? `
    <div class="field">
      <label>Milestones (one per line)</label>
      <textarea id="g-milestones" placeholder="Research options&#10;Set budget&#10;Book it"></textarea>
    </div>` : ''}
    ${type==='habit' ? `<div class="empty-state" style="padding:4px 0 14px;">You'll check this goal off from the Goals tab each day to build a streak.</div>` : ''}
    <button class="save-btn" id="save-goal">Save goal</button>
    `;
  }
  openSheet(bodyHtml());
  wire();
  function wire(){
    document.querySelectorAll('#type-seg button').forEach(b=>{
      b.onclick = ()=>{
        type = b.dataset.t;
        const title = document.getElementById('g-title').value;
        const desc = document.getElementById('g-desc').value;
        document.getElementById('sheet').innerHTML = `<div class="sheet-handle"></div>` + bodyHtml();
        wire();
        document.getElementById('g-title').value = title;
        document.getElementById('g-desc').value = desc;
      };
    });
    document.getElementById('save-goal').onclick = ()=>{
      const title = document.getElementById('g-title').value.trim();
      if(!title){ showToast('Give your goal a title'); return; }
      const goal = {
        id: uid(), title,
        desc: document.getElementById('g-desc').value.trim(),
        category: document.getElementById('g-category').value,
        type, state:'active',
        currentNumber:0, targetNumber:0, targetUnit:'',
        streak:0, bestStreak:0, lastCheckin:null,
        milestones:[]
      };
      if(type==='numeric'){
        goal.targetNumber = parseFloat(document.getElementById('g-target').value)||0;
        goal.targetUnit = document.getElementById('g-unit').value.trim();
      } else if(type==='checklist'){
        goal.milestones = document.getElementById('g-milestones').value
          .split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({text, done:false}));
      }
      STATE.goals.push(goal);
      queueSave(); closeSheet(); render(); showToast('Goal created');
    };
  }
}

function openBudgetSheet(group){
  const ym = monthKey(new Date());
  const current = (STATE.budgets[ym] && STATE.budgets[ym][group]) || '';
  openSheet(`
    <h2>${group} — monthly limit</h2>
    <div class="field">
      <label>Amount (₹)</label>
      <input type="number" inputmode="decimal" id="b-amount" value="${current||''}" placeholder="e.g. 5000">
    </div>
    <button class="save-btn" id="save-budget">Save limit</button>
  `);
  document.getElementById('save-budget').onclick = ()=>{
    const amt = parseFloat(document.getElementById('b-amount').value) || 0;
    if(!STATE.budgets[ym]) STATE.budgets[ym] = {};
    STATE.budgets[ym][group] = amt;
    queueSave(); closeSheet(); render(); showToast('Budget updated');
  };
}

/* ---------- Wire up static controls ---------- */
document.getElementById('fab').onclick = ()=>{
  if(currentTab==='money') openAddTransactionSheet();
  else if(currentTab==='goals') openAddGoalSheet();
};
document.querySelectorAll('#tabbar button').forEach(b=>{
  b.onclick = ()=>{ currentTab = b.dataset.tab; render(); };
});

/* ---------- Init ---------- */
(async function init(){
  document.getElementById('content').innerHTML = `<div class="empty-state">Loading your data…</div>`;
  await loadState();
  render();
})();
</script>
